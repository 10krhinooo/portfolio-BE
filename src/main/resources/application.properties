spring.application.name=kimangaVcitor
server.port=${PORT:8083}

# Content and analytics store. Railway injects DATABASE_URL for the Postgres plugin; falling back
# to a file-backed H2 keeps local development and the first deploy working with no setup.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/portfolio;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

portfolio.cors.allowed-origins=${ALLOWED_ORIGINS:https://10krhinooo.github.io,http://localhost:5173,http://localhost:4173}
portfolio.contact.max-per-hour=${CONTACT_MAX_PER_HOUR:5}
portfolio.contact.max-message-len=4000
portfolio.github.username=${GITHUB_USERNAME:10krhinooo}
portfolio.github.token=${GITHUB_TOKEN:}
portfolio.github.exclude=10krhinooo,10krhinooo.github.io,practice-repo,AS-ii,assignment-II,dashboard,embedders
portfolio.admin.api-key=${ADMIN_API_KEY:}
portfolio.analytics.salt=${ANALYTICS_SALT:change-me-in-production}
portfolio.analytics.max-per-min=${ANALYTICS_MAX_PER_MIN:60}
portfolio.seed.reset=${SEED_RESET:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
